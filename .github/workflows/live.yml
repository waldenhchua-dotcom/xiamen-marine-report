name: Manual live API fetch
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD in Asia/Shanghai; noncommercial use only'
        required: true
        type: string
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --frozen
      - name: Fetch and validate real evidence
        env:
          REPORT_DATE: ${{ inputs.date }}
        run: uv run python scripts/live_fetch.py --date "$REPORT_DATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-evidence-unapproved
          path: runs/live/
          retention-days: 7

